services:
    api:
        build:
            context: .
            target: dev
        container_name: media-analysis-backend
        ports:
            - "${BACKEND_PORT}:8000"
        volumes:
            - ./app:/app/app
            - ./uploads:/app/uploads
        env_file:
            - .env
        depends_on:
            - db

    db:
        image: postgres:16
        container_name: media-analysis-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    pgadmin:
        image: dpage/pgadmin4
        container_name: media-analysis-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        ports:
            - "${PGADMIN_PORT}:80"
        depends_on:
            - db

volumes:
    postgres_data:
